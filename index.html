<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MRE Live Sales Copilot PRO</title>
<style>
:root {
  --bg:       #080c18;
  --bg2:      #0f1525;
  --bg3:      #182035;
  --border:   #1e2d4a;
  --v-color:  #4a9eff;   /* Verkäufer */
  --k-color:  #3de88a;   /* Kunde */
  --warn:     #ff4545;
  --text:     #dde4ef;
  --dim:      #6b7fa0;
  --gold:     #ffe566;
  --phase-bg: #0e2244;
}
*{box-sizing:border-box;margin:0;padding:0;}

body{
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
  height:100vh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  font-size:15px;
}

/* ── HEADER ── */
header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 18px;
  background:var(--bg2);
  border-bottom:1px solid var(--border);
  flex-shrink:0;
  gap:12px;
}
.logo{
  font-size:1rem;
  font-weight:800;
  letter-spacing:.04em;
  color:#fff;
  white-space:nowrap;
}
.logo span{color:var(--gold);}
.header-right{display:flex;align-items:center;gap:10px;flex-shrink:0;}
.pill{
  padding:4px 13px;
  border-radius:99px;
  font-size:.72rem;
  font-weight:700;
  letter-spacing:.03em;
  transition:all .3s;
}
.pill.ok   {background:rgba(61,232,138,.15);color:var(--k-color);border:1px solid rgba(61,232,138,.3);}
.pill.err  {background:rgba(255,69,69,.15); color:var(--warn);   border:1px solid rgba(255,69,69,.3);}
.pill.wait {background:rgba(107,127,160,.1);color:var(--dim);    border:1px solid var(--border);}
button.action{
  background:var(--bg3);
  color:var(--dim);
  border:1px solid var(--border);
  padding:5px 13px;
  border-radius:6px;
  cursor:pointer;
  font-size:.78rem;
  transition:all .2s;
}
button.action:hover{color:var(--text);border-color:#3a5a90;}

/* ── 3-COLUMN GRID ── */
.grid{
  display:grid;
  grid-template-columns:1fr 1.55fr .95fr;
  gap:10px;
  padding:10px;
  flex:1;
  min-height:0;
}

/* ── PANEL ── */
.panel{
  background:var(--bg2);
  border:1px solid var(--border);
  border-radius:12px;
  padding:14px 16px;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  gap:0;
}
.ptitle{
  font-size:.65rem;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.12em;
  color:var(--dim);
  margin-bottom:12px;
  flex-shrink:0;
}

/* ── TRANSCRIPT ── */
#tx-list{
  flex:1;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:7px;
  padding-right:4px;
}
.tx-line{
  padding:8px 11px;
  border-radius:8px;
  font-size:.88rem;
  line-height:1.45;
  animation:fadeIn .25s ease;
}
.tx-line.v{background:rgba(74,158,255,.09);border-left:3px solid var(--v-color);}
.tx-line.k{background:rgba(61,232,138,.09);border-left:3px solid var(--k-color);}
.sp{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;margin-bottom:3px;}
.sp.v{color:var(--v-color);}
.sp.k{color:var(--k-color);}

/* ── COACHING (MIDDLE) ── */
#warn-banner{
  display:none;
  background:rgba(255,69,69,.18);
  border:1px solid rgba(255,69,69,.5);
  color:#ff8080;
  padding:9px 13px;
  border-radius:8px;
  font-size:.82rem;
  font-weight:600;
  line-height:1.4;
  margin-bottom:12px;
  flex-shrink:0;
}
#coach-body{
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:14px;
  min-height:0;
}
#main-label{
  font-size:.6rem;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.15em;
  color:var(--dim);
  margin-bottom:6px;
}
#main-text{
  font-size:clamp(1.15rem,1.9vw,1.7rem);
  font-weight:700;
  color:var(--gold);
  line-height:1.45;
  font-family:Georgia,'Times New Roman',serif;
  word-break:break-word;
}
#main-text.empty{
  color:var(--dim);
  font-size:1rem;
  font-weight:400;
  font-family:inherit;
  font-style:italic;
}
#loading-indicator{
  display:none;
  align-items:center;
  gap:8px;
  color:var(--dim);
  font-size:.82rem;
}
.dot-wave{display:flex;gap:4px;}
.dot-wave span{
  width:6px;height:6px;
  border-radius:50%;
  background:var(--v-color);
  animation:dotBounce .8s infinite;
}
.dot-wave span:nth-child(2){animation-delay:.15s;}
.dot-wave span:nth-child(3){animation-delay:.3s;}
@keyframes dotBounce{0%,80%,100%{transform:scale(.7);opacity:.5}40%{transform:scale(1);opacity:1}}

.alt-section{display:none;}
.alt-label{
  font-size:.62rem;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.1em;
  color:var(--dim);
  margin-bottom:7px;
}
.alt-item{
  background:var(--bg3);
  border:1px solid var(--border);
  border-radius:7px;
  padding:8px 12px;
  font-size:.83rem;
  color:#8fa3c0;
  font-style:italic;
  cursor:pointer;
  margin-bottom:5px;
  transition:border-color .2s,color .2s;
  line-height:1.4;
}
.alt-item:hover{border-color:var(--v-color);color:var(--text);}

/* ── INFO (RIGHT) ── */
.info-block{margin-bottom:18px;}
.ilab{
  font-size:.62rem;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.1em;
  color:var(--dim);
  margin-bottom:6px;
}
#phase-badge{
  display:inline-block;
  padding:5px 15px;
  border-radius:99px;
  background:var(--phase-bg);
  color:#7ab8ff;
  font-size:.85rem;
  font-weight:700;
  border:1px solid #1e4080;
}
#einwand-tag{
  display:inline-block;
  padding:5px 13px;
  border-radius:7px;
  font-size:.82rem;
  font-weight:700;
}
#einwand-tag.active{
  background:rgba(255,69,69,.14);
  color:#ff8080;
  border:1px solid rgba(255,69,69,.35);
}
#einwand-tag.none{
  background:rgba(61,232,138,.1);
  color:var(--k-color);
  border:1px solid rgba(61,232,138,.25);
}
#signal-text{
  font-size:.85rem;
  color:var(--text);
  line-height:1.5;
  font-style:italic;
  min-height:2rem;
}
#next-step{
  font-size:.88rem;
  color:var(--text);
  line-height:1.5;
  background:var(--bg3);
  border-radius:8px;
  padding:10px 12px;
  border-left:3px solid var(--v-color);
  min-height:2.5rem;
}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#2a3a58;border-radius:4px;}

@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>

<header>
  <div class="logo">⚡ MRE <span>Sales Copilot PRO</span></div>
  <div class="header-right">
    <div id="whisper-pill" class="pill wait">Whisper …</div>
    <div id="ai-pill"      class="pill wait">KI …</div>
    <div id="ws-pill"      class="pill err">● Getrennt</div>
    <button class="action" onclick="exportTranscript()">Export</button>
    <button class="action" onclick="resetSession()">Reset</button>
    <button class="action" onclick="window.open('/api/devices')">Geräte</button>
  </div>
</header>

<div class="grid">

  <!-- ── LINKS: Transkript ── -->
  <div class="panel">
    <div class="ptitle">Live Transkript</div>
    <div id="tx-list"></div>
  </div>

  <!-- ── MITTE: Coaching ── -->
  <div class="panel">
    <div class="ptitle">Coaching</div>
    <div id="warn-banner"></div>
    <div id="coach-body">
      <div>
        <div id="main-label">JETZT SAGEN</div>
        <div id="main-text" class="empty">Warte auf Kundensatz&nbsp;…</div>
      </div>
      <div id="loading-indicator">
        <div class="dot-wave"><span></span><span></span><span></span></div>
        <span>Analysiere …</span>
      </div>
      <div class="alt-section" id="alt-section">
        <div class="alt-label">Alternativen</div>
        <div id="alt-list"></div>
      </div>
    </div>
  </div>

  <!-- ── RECHTS: Info ── -->
  <div class="panel">
    <div class="ptitle">Gesprächs-Analyse</div>

    <div class="info-block">
      <div class="ilab">Phase</div>
      <div id="phase-badge">–</div>
    </div>

    <div class="info-block">
      <div class="ilab">Erkannter Einwand</div>
      <div id="einwand-tag" class="none">Kein Einwand</div>
    </div>

    <div class="info-block">
      <div class="ilab">Kundensignal</div>
      <div id="signal-text">–</div>
    </div>

    <div class="info-block">
      <div class="ilab">Nächster Schritt</div>
      <div id="next-step">–</div>
    </div>
  </div>

</div><!-- .grid -->

<script>
const WS_URL = 'ws://' + location.host + '/ws';
let ws = null;
let reconnTimer = null;
let pingTimer = null;
let transcriptLines = [];   // [{ts, speaker, text}]
let sessionStart = new Date();

// ── WebSocket ──────────────────────────────────────────────────────────────
function connect() {
  clearTimeout(reconnTimer);
  ws = new WebSocket(WS_URL);

  ws.onopen = () => {
    setPill('ws-pill', '● Verbunden', 'ok');
    startPing();
  };
  ws.onclose = () => {
    setPill('ws-pill', '● Getrennt', 'err');
    clearInterval(pingTimer);
    reconnTimer = setTimeout(connect, 3000);
  };
  ws.onerror = () => ws.close();
  ws.onmessage = (e) => {
    try { dispatch(JSON.parse(e.data)); }
    catch(_) {}
  };
}

function dispatch(msg) {
  switch(msg.type) {
    case 'status':       handleStatus(msg); break;
    case 'transcript':   addTranscript(msg); break;
    case 'coach_loading':toggleLoading(msg.loading); break;
    case 'coach':        showCoach(msg.data); break;
    case 'reset_ok':     clearUI(); break;
  }
}

// ── Status ────────────────────────────────────────────────────────────────
function handleStatus(msg) {
  setPill('whisper-pill', msg.whisper ? 'Whisper ✓' : 'Whisper ✗', msg.whisper ? 'ok' : 'err');
  setPill('ai-pill',      msg.anthropic ? 'KI ✓'    : 'KI ✗',     msg.anthropic ? 'ok' : 'err');
  const streams = msg.streams || 0;
  setPill('ws-pill',
    streams === 2 ? '● Mikro + Loopback' :
    streams === 1 ? '● 1 Stream' : '● Kein Audio',
    streams > 0 ? 'ok' : 'err'
  );
}

// ── Transcript ────────────────────────────────────────────────────────────
function addTranscript(msg) {
  const ts = new Date();
  transcriptLines.push({ ts, speaker: msg.speaker, text: msg.text });

  const list = document.getElementById('tx-list');
  const isV = msg.speaker === 'Verkäufer';
  const div = document.createElement('div');
  div.className = 'tx-line ' + (isV ? 'v' : 'k');
  const timeStr = ts.toTimeString().slice(0,8);
  div.innerHTML =
    '<div class="sp ' + (isV ? 'v' : 'k') + '">' +
      esc(msg.speaker) +
      '<span style="font-weight:400;opacity:.5;margin-left:8px;font-size:.6rem;">' + timeStr + '</span>' +
    '</div>' +
    '<div>' + esc(msg.text) + '</div>';
  list.appendChild(div);
  list.scrollTop = list.scrollHeight;
}

function exportTranscript() {
  if (!transcriptLines.length) { alert('Noch kein Transkript vorhanden.'); return; }
  const dateStr = sessionStart.toLocaleDateString('de-DE');
  const timeStr = sessionStart.toLocaleTimeString('de-DE');
  let txt = `MRE Sales Copilot PRO – Gesprächsprotokoll\n`;
  txt    += `Datum: ${dateStr}  ${timeStr}\n`;
  txt    += '='.repeat(52) + '\n\n';
  for (const l of transcriptLines) {
    const t = l.ts.toTimeString().slice(0,8);
    txt += `[${t}] ${l.speaker}:\n${l.text}\n\n`;
  }
  const blob = new Blob([txt], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'transkript_' + sessionStart.toISOString().slice(0,16).replace('T','_') + '.txt';
  a.click();
  URL.revokeObjectURL(a.href);
}

// ── Coach ─────────────────────────────────────────────────────────────────
function toggleLoading(on) {
  document.getElementById('loading-indicator').style.display = on ? 'flex' : 'none';
  document.getElementById('main-text').style.opacity = on ? '.35' : '1';
}

function showCoach(d) {
  // Haupttext
  const mainEl = document.getElementById('main-text');
  if (d.jetzt_sagen) {
    mainEl.className = '';
    mainEl.textContent = d.jetzt_sagen;
  }

  // Warnung
  const warnEl = document.getElementById('warn-banner');
  if (d.warnung && d.warnung !== 'null' && d.warnung !== null) {
    warnEl.textContent = '⚠  ' + d.warnung;
    warnEl.style.display = 'block';
  } else {
    warnEl.style.display = 'none';
  }

  // Alternativen
  const altSection = document.getElementById('alt-section');
  const altList    = document.getElementById('alt-list');
  const alts = (d.alternativen || []).filter(Boolean);
  if (alts.length) {
    altList.innerHTML = alts.map(a =>
      '<div class="alt-item">' + esc(a) + '</div>'
    ).join('');
    altSection.style.display = 'block';
  } else {
    altSection.style.display = 'none';
  }

  // Phase
  if (d.phase) document.getElementById('phase-badge').textContent = d.phase;

  // Einwand
  const ewEl = document.getElementById('einwand-tag');
  const hasEinwand = d.einwand && d.einwand !== 'null' && d.einwand !== null;
  ewEl.textContent = hasEinwand ? d.einwand : 'Kein Einwand';
  ewEl.className   = hasEinwand ? 'active' : 'none';

  // Kundensignal
  if (d.kundensignal) document.getElementById('signal-text').textContent = d.kundensignal;

  // Nächster Schritt
  if (d.naechster_schritt) document.getElementById('next-step').textContent = d.naechster_schritt;
}

// ── Reset ──────────────────────────────────────────────────────────────────
function resetSession() {
  if (ws?.readyState === WebSocket.OPEN) ws.send('reset');
  clearUI();
}
function clearUI() {
  transcriptLines = [];
  sessionStart = new Date();
  document.getElementById('tx-list').innerHTML = '';
  const mt = document.getElementById('main-text');
  mt.className = 'empty';
  mt.textContent = 'Warte auf Kundensatz …';
  mt.style.opacity = '1';
  document.getElementById('warn-banner').style.display = 'none';
  document.getElementById('alt-section').style.display = 'none';
  document.getElementById('loading-indicator').style.display = 'none';
  document.getElementById('phase-badge').textContent = '–';
  document.getElementById('einwand-tag').textContent = 'Kein Einwand';
  document.getElementById('einwand-tag').className = 'none';
  document.getElementById('signal-text').textContent = '–';
  document.getElementById('next-step').textContent = '–';
}

// ── Helpers ────────────────────────────────────────────────────────────────
function setPill(id, text, cls) {
  const el = document.getElementById(id);
  if (!el) return;
  el.textContent = text;
  el.className = 'pill ' + cls;
}
function startPing() {
  clearInterval(pingTimer);
  pingTimer = setInterval(() => {
    if (ws?.readyState === WebSocket.OPEN) ws.send('ping');
  }, 25000);
}
function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

connect();
</script>
</body>
</html>
